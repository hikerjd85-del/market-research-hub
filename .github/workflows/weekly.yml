name: Weekly Market Research Hub update

on:
  schedule:
    - cron: "0 9 * * 1"   # every Monday 09:00 UTC
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      OPENALEX_API_KEY: ${{ secrets.OPENALEX_API_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Optional Claude summaries
        if: ${{ env.ANTHROPIC_API_KEY != '' }}
        run: pip install anthropic
      - name: Gather, classify and publish this week
        run: python pipeline/run.py
      - name: Commit new issue (Vercel redeploys on push)
        run: |
          git config user.name "market-research-bot"
          git config user.email "market-research-bot@users.noreply.github.com"
          git add site/data site/logos data/store.json
          git diff --cached --quiet || git commit -m "Weekly update $(date -u +%G-W%V)"
          git pull --rebase --autostash origin main
          git push
